version: '3.8'

services:
  image-editor:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - REMOVEBG_API_KEY=${REMOVEBG_API_KEY:-your_removebg_key_here}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - image-editor
    restart: unless-stopped